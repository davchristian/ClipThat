<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClipThat · Wireframe interaktif</title>
  <style>
    *{box-sizing:border-box} :root{font-family:Arial,Helvetica,sans-serif;color:#202020;background:#ededeb;font-size:14px;line-height:1.55}
    body{margin:0}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
    .studio{height:74px;border-bottom:1px solid #cacac7;padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#f9f9f7}
    .brand{font-size:21px;font-weight:700;letter-spacing:-.8px}.studio small{color:#6b6b68}.switch{display:flex;gap:6px}.switch button{border:1px solid #b8b8b4;padding:8px 14px;background:transparent;border-radius:4px}.switch button.active{background:#262626;color:#fff;border-color:#262626}
    .workspace{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 74px)}.navigator{background:#f9f9f7;border-right:1px solid #cacac7;padding:24px 16px}.navigator h2{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#6b6b68;margin:0 12px 15px}.screen-link{display:flex;gap:12px;border:0;background:transparent;width:100%;text-align:left;padding:10px 12px;border-radius:4px;color:#555}.screen-link:hover{background:#e8e8e5}.screen-link.active{background:#deded9;color:#111;font-weight:700}.screen-link span:first-child{font-family:monospace;color:#888;min-width:20px;font-size:12px}.navigator p{color:#777;font-size:12px;padding:14px 12px;border-top:1px solid #dededb;margin-top:24px}
    .stage{padding:25px 32px 45px;min-width:0}.stage-heading{display:flex;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 18px}.stage-heading h1{font-size:16px;margin:0}.stage-heading p{font-size:12px;color:#696965;margin:4px 0 0}.stage-heading button{border:1px solid #bbb;background:transparent;padding:6px 10px;align-self:flex-start;border-radius:4px}.stage-heading a{color:#333;font-size:12px}
    .frame{margin:auto;background:white;border:1px solid #aaa;box-shadow:0 6px 24px #00000008;width:100%;max-width:1120px;min-height:690px}.frame.mobile{max-width:414px;min-height:790px;border-radius:18px;overflow:hidden}.device-bar{padding:9px 20px;border-bottom:1px solid #eee;font:11px monospace;display:flex;justify-content:space-between}.app-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d5d5d5;padding:15px 22px}.wordmark{font-size:19px;letter-spacing:-.7px;font-weight:bold}.role-chip,.badge{display:inline-block;font-size:11px;border:1px solid #bbb;background:#f5f5f5;padding:3px 8px;border-radius:3px}.app-body{padding:24px}.app-body h2{font-size:24px;letter-spacing:-.6px;line-height:1.2;margin:0 0 7px}.subtitle{color:#666;font-size:13px;margin:0 0 23px}.blocks{display:flex;flex-direction:column;gap:15px}.blocks h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:10px 0 0;color:#555}.card{border:1px solid #bdbdbd;background:#fff;padding:17px;position:relative}.card h4{font-size:15px;line-height:1.5;margin:0 0 7px}.card p{margin:0;color:#555;white-space:pre-line;font-size:13px}.card .badge{margin-bottom:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{border:1px solid #aaa;background:#fff;color:#222;padding:10px 13px;font-size:12px;font-weight:600;border-radius:3px;min-height:40px}.btn:hover{background:#eee}.btn.primary{background:#2a2a2a;color:#fff;border-color:#2a2a2a}.btn.primary:hover{background:#444}.blocks>.btn{width:100%}.row{display:flex;flex-wrap:wrap;gap:8px}.row .btn{flex:1}.note{border:1px dashed #aaa;background:#f7f7f5;padding:13px;font-size:12px;color:#555}.quote{border-left:3px solid #999;background:#f5f5f5;padding:13px 15px}.quote time{font-family:monospace;font-size:11px;display:block;color:#777;margin-bottom:6px}.quote p{font-size:13px;margin:0}.bookmark-row{display:flex;gap:8px;margin-top:11px}.bookmark-row button{border:1px solid #aaa;background:#fff;font-size:11px;padding:6px 8px}.bookmark-row button.saved{background:#333;color:white}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:bold}.field input,.field textarea{width:100%;border:1px solid #aaa;background:#fff;padding:11px;border-radius:3px;color:#222}.field textarea{min-height:96px;resize:vertical}.photo{border:1px dashed #999;min-height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;background:repeating-linear-gradient(135deg,#fafafa,#fafafa 14px,#f1f1f1 14px,#f1f1f1 15px);padding:18px;text-align:center;font-size:13px;color:#666}.photo small{font-size:10px}.photo img{max-width:100%;max-height:230px;object-fit:contain}.meter-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.meter-track{height:9px;background:#e6e6e6}.meter-track span{display:block;height:100%;background:#777}.graph{width:100%;border:1px solid #ccc;background:#fafafa}.graph text{font-size:11px;font-family:Arial,sans-serif;fill:#333}.graph .node{cursor:pointer}.graph .node:focus rect{stroke-width:3}.graph .selected rect{fill:#dedede;stroke:#333;stroke-width:2}.bottom-nav{margin-top:28px;border-top:1px solid #ccc;padding:13px 8px;display:flex;justify-content:space-around;gap:5px}.bottom-nav button{font-size:11px;border:0;background:none;color:#555;padding:8px}.bottom-nav button:hover{background:#eee}.desktop .app-body{max-width:800px;margin:auto}.desktop .blocks{display:grid;grid-template-columns:1fr 1fr;align-items:start}.desktop .blocks>.heading,.desktop .blocks>.note,.desktop .blocks>.row,.desktop .blocks>.quote,.desktop .blocks>.btn,.desktop .blocks>.graph{grid-column:1/-1}.desktop .app-header{padding:18px 30px}
    .annotation{max-width:800px;margin:18px auto 0;color:#65655f;font-size:12px}.annotation p{margin:5px 0}.annotation code{font-size:11px}.scenarios{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.scenarios button{font-size:11px;padding:6px 9px;background:#f7f7f5;border:1px dashed #999;border-radius:3px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:13px 19px;border-radius:4px;z-index:5;max-width:min(90vw,580px);font-size:13px}.toast[hidden]{display:none}.dialog{border:1px solid #777;border-radius:6px;padding:24px;width:calc(100% - 32px);max-width:460px}.dialog::backdrop{background:#0006}.dialog h2{font-size:20px;margin-top:0}.dialog p{font-size:13px;color:#555;white-space:pre-line}.dialog label{display:block;margin:10px 0;font-size:13px}.dialog .actions{justify-content:flex-end}.error{padding:12px;border:1px solid #888;background:#eee;font-size:12px;margin-bottom:15px}
    @media(max-width:850px){.workspace{grid-template-columns:190px minmax(0,1fr)}.stage{padding:20px 16px}.navigator{padding:20px 8px}.desktop .blocks{display:flex}.studio{padding:0 16px}.studio small{display:none}}
    @media(max-width:620px){.workspace{display:block}.navigator{border:0;border-bottom:1px solid #ccc;padding:12px}.navigator h2,.navigator p{display:none}.screen-list{display:flex;overflow:auto;gap:5px}.screen-link{flex:0 0 auto;width:auto;padding:7px 10px;font-size:11px}.screen-link span:first-child{display:none}.stage{padding:18px 10px}.stage-heading{padding:0 4px}.stage-heading a{display:none}.app-body{padding:20px}.frame.mobile{border-radius:10px}.studio{height:65px}.switch button{font-size:12px;padding:7px 10px}.desktop .blocks{display:flex}}
    .frame.desktop{max-width:1120px;min-height:720px;border-radius:0;overflow:visible}
    .desktop .app-header{padding:18px 24px;gap:16px}.app-context{color:#666;font-size:12px;flex:1;margin-left:22px}
    .app-shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:650px}
    .app-nav{border-right:1px solid #d5d5d5;background:#fafafa;padding:24px 12px;display:flex;flex-direction:column;gap:6px}
    .app-nav-label{font-size:10px;letter-spacing:1.5px;color:#777;text-transform:uppercase;padding:0 12px;margin-bottom:8px}
    .app-nav button{border:0;background:transparent;color:#555;padding:11px 12px;text-align:left;font-size:12px;border-radius:3px}
    .app-nav button:hover{background:#eee}.app-nav button.active{background:#dedede;color:#111;font-weight:bold}
    .desktop .app-body{width:100%;max-width:none;margin:0;padding:28px;min-width:0;container-type:inline-size}
    .desktop .app-body h2{font-size:26px}.desktop .blocks{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:24px;align-items:start}
    .panel{display:flex;flex-direction:column;gap:16px;min-width:0}.panel h3{margin:0 0 2px}.panel>.btn{width:100%}
    .panel-aside{padding:18px;border:1px solid #ccc;background:#fafafa}.panel-aside .card{background:#fff}.panel-aside .note{background:#fff}
    .layout-toolbar{grid-column:1/-1}.desktop .blocks.layout-center{display:block;max-width:640px;margin:0 auto}
    .desktop .blocks.layout-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop .blocks.layout-integrations{grid-template-columns:repeat(3,minmax(0,1fr))}
    .desktop .blocks.layout-cards>.card{min-width:0}.question-list{display:flex;flex-direction:column;gap:16px}
    .panel .quote p{line-height:1.75}.panel .graph{max-height:420px}.annotation{max-width:1120px}
    @container(max-width:680px){.desktop .blocks,.desktop .blocks.layout-integrations{grid-template-columns:minmax(0,1fr)}.panel-aside{padding:16px}}
    @media(max-width:850px){.app-shell{grid-template-columns:150px minmax(0,1fr)}.desktop .app-body{padding:20px}.desktop .blocks{display:grid}.app-context{display:none}}
    @media(max-width:620px){.app-shell{grid-template-columns:minmax(0,1fr)}.app-nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid #ccc;padding:8px}.app-nav-label{display:none}.app-nav button{white-space:nowrap}.desktop .blocks.layout-cards{grid-template-columns:minmax(0,1fr)}.desktop .app-body{padding:18px}}
    @media print{.studio,.navigator,.stage-heading,.scenarios,.toast,.dialog,.app-nav{display:none}.workspace{display:block}.stage{padding:0}.frame{border:1px solid #ccc;box-shadow:none;max-width:100%;min-height:0}.app-shell{display:block}.annotation{break-inside:avoid}}
  </style>
</head>
<body>
  <header class="studio"><div><span class="brand">ClipThat</span> <small> / Wireframe desktop · versi 02</small></div><div class="switch" aria-label="Pilih alur"><button id="student-role" type="button">Mahasiswa</button><button id="lecturer-role" type="button">Dosen</button></div></header>
  <div class="workspace">
    <aside class="navigator"><h2>Daftar layar</h2><nav class="screen-list" id="screen-list" aria-label="Navigasi prototipe"></nav><p>Wireframe dengan data contoh. Tombol menguji alur, tanpa merekam, mengirim pertanyaan, atau menghubungkan akun sungguhan.</p></aside>
    <main class="stage"><div class="stage-heading"><div><h1 id="screen-name"></h1><p id="screen-count"></p></div><div><a href="README.md">Panduan & pemetaan kebutuhan</a> <button id="reset" type="button">Reset demo</button></div></div><section id="frame" class="frame" aria-label="Pratinjau layar aplikasi"></section><aside id="annotation" class="annotation" aria-label="Catatan wireframe"></aside></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="actions"><button type="button" class="btn" id="dialog-cancel">Batal</button><button type="button" class="btn primary" id="dialog-confirm">Konfirmasi</button></div></dialog>
  <script src="screens.js"></script>
  <script>
    const screens=globalThis.CLIPTHAT_SCREENS;
    const byId=new Map(screens.map(s=>[s.id,s]));
    const state={role:'student',screen:'s-home',bookmarks:{},support:false,sent:[],answer:'',answered:false,connections:{google:true,notion:false,outlook:false},agendaConfirmed:false,agenda:null,agendaRejected:false,deleted:{},photo:null,photoTime:'00:18:15',scenario:null,graphNode:'Representasi matriks',edgeRemoved:false,graphCorrection:null,sharedArchived:false,restored:false};
    const $=id=>document.getElementById(id);
    const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const btn=b=>`<button type="button" class="btn ${b.primary?'primary':''}" ${b.target?`data-target="${escape(b.target)}"`:`data-action="${escape(b.action)}"`}>${escape(b.label)}</button>`;
    const connectionName={google:'Google Calendar',notion:'Notion',outlook:'Microsoft Outlook'};
    const scenarioLabels={'transcript-error':'Transkrip terputus','short-capture':'Capture sebelum 90 detik','processing-ready':'Pemrosesan selesai','processing-error':'Pemrosesan gagal','agenda-conflict':'Deadline berubah','agenda-ambiguous':'Tanggal ambigu','agenda-manual':'Agenda manual','sync-error':'Sinkronisasi gagal','microphone-error':'Mikrofon ditolak','upload-error':'Unggahan gagal'};
    function graph(){const nodes=[['Basis dan dimensi',18,22,166],['Representasi matriks',151,110,180],['Kernel dan image',18,202,166]];return `<svg class="graph" viewBox="0 0 360 276" role="img" aria-label="Graph hubungan subbab"><path d="M101 66 L236 110 M236 154 L101 202" fill="none" stroke="#999" stroke-width="1.5" ${state.edgeRemoved?'stroke-dasharray="4 4"':''}/><text x="144" y="84">prasyarat</text>${nodes.map(([name,x,y,w])=>`<g class="node ${state.graphNode===name?'selected':''}" role="button" tabindex="0" aria-label="Pilih ${name}" data-node="${name}"><rect x="${x}" y="${y}" width="${w}" height="44" fill="white" stroke="#aaa"/><text x="${x+w/2}" y="${y+26}" text-anchor="middle">${name}</text></g>`).join('')}</svg>`}
    function block(b,index){
      if(b.type==='heading')return `<h3 class="heading">${escape(b.text)}</h3>`;
      if(b.type==='button')return btn(b);
      if(b.type==='row')return `<div class="row">${b.buttons.map(btn).join('')}</div>`;
      if(b.type==='note')return `<div class="note">${escape(b.text)}</div>`;
      if(b.type==='field')return `<div class="field"><label for="${escape(b.name)}">${escape(b.label)}</label>${b.multiline?`<textarea id="${b.name}" name="${b.name}" placeholder="${escape(b.placeholder||'')}">${escape(b.value||'')}</textarea>`:`<input id="${b.name}" name="${b.name}" type="${b.inputType||'text'}" value="${escape(b.value||'')}" placeholder="${escape(b.placeholder||'')}" ${b.required?'required':''}>`}</div>`;
      if(b.type==='file')return `<div class="field"><label for="file-upload">${escape(b.label)}</label><input id="file-upload" type="file" ${b.accept?`accept="${escape(b.accept)}"`:''}></div>`;
      if(b.type==='photo')return `<div class="photo" id="photo-preview">${state.photo&&state.screen==='s-photo'?`<img src="${state.photo}" alt="Pratinjau foto pilihanmu">`:`<span>${escape(b.text)}</span><small>${escape(b.caption)}</small>`}</div>`;
      if(b.type==='quote')return `<div class="quote"><time>${escape(b.time)}</time><p>${escape(b.text)}</p>${b.bookmark?`<div class="bookmark-row">${['Bingung','Review nanti'].map(label=>`<button type="button" class="${state.bookmarks[b.time]===label?'saved':''}" aria-pressed="${state.bookmarks[b.time]===label}" data-bookmark="${b.time}" data-label="${label}">${label}</button>`).join('')}</div>`:''}</div>`;
      if(b.type==='meter')return `<div><div class="meter-label"><span>${escape(b.label)}</span><span>${b.value}%</span></div><div class="meter-track"><span style="width:${b.value}%"></span></div></div>`;
      if(b.type==='graph')return graph();
      if(b.type==='card'){
        let title=b.title,text=b.text,badge=b.badge,buttons=b.buttons||[];
        if(state.screen==='s-integrations'){const key=['google','notion','outlook'][index];if(key){badge=state.connections[key]?'Terhubung':'Belum terhubung';buttons=[{label:state.connections[key]?'Putus koneksi':`Hubungkan ${connectionName[key]}`,action:`toggle-${key}`}];text=state.connections[key]?'Tujuan demo: Agenda Kuliah':'Pilih tujuan agenda setelah terhubung.'}}
        if(state.screen==='s-graph'&&title.startsWith('Subbab dipilih')){title=`Subbab dipilih: ${state.graphNode}`;text=state.graphNode==='Basis dan dimensi'?'Pertemuan 4\nTerkait: representasi matriks':state.graphNode==='Kernel dan image'?'Pertemuan 5\nTerkait: representasi matriks':text}
        if(state.screen==='s-questions'&&index===0){badge=`${8+(state.support?1:0)} dukungan`;buttons=[{label:state.support?'Batalkan dukungan':'Dukung pertanyaan',action:'support'}];if(state.answered)text=`Sudah dijawab\n${state.answer||'Dijawab secara lisan oleh dosen.'}`}
        if(state.screen==='s-agenda'&&index===0){if(state.agendaRejected)return `<div class="note">Draf tugas ditolak. Agenda belum dibuat.</div>`;if(state.agendaConfirmed){title=state.agenda?.title||title.replace('Draf · ','');badge='Terkonfirmasi';text=`${state.agenda?.date||'2026-10-10'} · ${state.agenda?.time||'23:59'}\n${state.agenda?.scope||'Representasi matriks'}`;buttons=[{label:'Edit agenda',target:'s-agenda-change'}]}}
        if(state.screen==='d-live'&&state.answered&&b.badge)text='Anonim · Sudah dijawab';
        if(state.screen==='d-archive'&&state.restored)return `<div class="note">Sesi berhasil dipulihkan. Data bersama dapat diakses peserta kembali.</div>`;
        if(state.screen==='d-results'&&state.sharedArchived)return `<div class="note">Sesi telah masuk arsip penghapusan. Sumber bersama disembunyikan dari peserta.</div>`;
        return `<article class="card">${badge?`<span class="badge">${escape(badge)}</span>`:''}<h4>${escape(title)}</h4><p>${escape(text)}</p>${buttons.length?`<div class="actions">${buttons.map(btn).join('')}</div>`:''}</article>`;
      }return '';
    }
    function desktopBlocks(screen){
      const layouts={
        's-home':{main:[0,1,2],aside:[3,4,5]},
        's-join':{main:[0,1,3],aside:[2],asideTitle:'Alternatif kode: QR'},
        's-brief':{main:[0,1,2],aside:[3,4,5]},
        's-live':{main:[0,1,2,3],aside:[4,5,6],mainTitle:'Transkrip langsung',asideTitle:'Tindakan saat kelas'},
        's-capture':{main:[0,1,2],aside:[3,4,5,6],mainTitle:'Konteks pembahasan',asideTitle:'Pertanyaan dan review'},
        's-questions':{main:[0,1],aside:[2,3],mainTitle:'Diskusi kelas',asideTitle:'Ajukan pertanyaan'},
        's-photo':{main:[0,1],aside:[2,3,4],asideTitle:'Kaitkan dengan transkrip'},
        's-notes':{toolbar:[0],main:[1,2,3],aside:[4,5],asideTitle:'Tindak lanjut'},
        's-review':{main:[0,1,2],aside:[3],asideTitle:'Sumber pendukung'},
        's-graph':{main:[0],aside:[1,2],asideTitle:'Detail subbab'},
        's-agenda':{main:[0,1],aside:[2,3],mainTitle:'Kegiatan akademik',asideTitle:'Kelola agenda'},
        's-agenda-change':{main:[1,2,3,4,5,6],aside:[0],asideTitle:'Sumber pengumuman'},
        'd-setup':{main:[0,1,2,3],aside:[4,5,6],asideTitle:'Akses dan mulai sesi'},
        'd-live':{main:[0,1],aside:[2,3,4,5,6],mainTitle:'Dokumentasi kelas',asideTitle:'Interaksi dan kontrol'},
        'd-results':{main:[0,1,2,3,4],aside:[5,6,7],asideTitle:'Tindak lanjut dosen'},
        'd-graph':{main:[0],aside:[1,2,3,4,5],asideTitle:'Edit hubungan subbab'}
      };
      const layout=layouts[screen.id];
      if(!layout)return `<section class="panel">${screen.blocks.map(block).join('')}</section>`;
      const part=(indices,title,kind)=>`<section class="panel panel-${kind}">${title?`<h3>${escape(title)}</h3>`:''}${kind==='main'&&screen.id==='s-questions'?'<div class="question-list">':''}${indices.map(i=>block(screen.blocks[i],i)).join('')}${kind==='main'&&screen.id==='s-questions'?'</div>':''}</section>`;
      return `${layout.toolbar?`<div class="layout-toolbar">${layout.toolbar.map(i=>block(screen.blocks[i],i)).join('')}</div>`:''}${part(layout.main,layout.mainTitle,'main')}${part(layout.aside,layout.asideTitle,'aside')}`;
    }
    function appNavigation(student){
      const entries=student?[['Beranda','s-home',['s-home']],['Kelas','s-brief',['s-join','s-brief','s-live','s-capture','s-questions','s-photo','s-processing']],['Catatan','s-notes',['s-notes']],['Review personal','s-review',['s-review']],['Peta materi','s-graph',['s-graph']],['Agenda','s-agenda',['s-agenda','s-agenda-change']],['Integrasi','s-integrations',['s-integrations']]]:[['Kelas saya','d-home',['d-home']],['Persiapan sesi','d-setup',['d-setup']],['Sesi aktif','d-live',['d-live']],['Rekap kelas','d-results',['d-results']],['Graph materi','d-graph',['d-graph']],['Arsip','d-archive',['d-archive']]];
      return `<nav class="app-nav" aria-label="Navigasi aplikasi"><span class="app-nav-label">Ruang ${student?'belajar':'dosen'}</span>${entries.map(([label,target,active])=>`<button type="button" data-target="${target}" class="${active.includes(state.screen)?'active':''}" ${active.includes(state.screen)?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`;
    }
    function show(id,scenario=null){if(!byId.has(id))id='s-home';state.screen=id;state.role=byId.get(id).role;state.scenario=scenario;location.hash=id;render()}
    function render(){
      const s=byId.get(state.screen),group=screens.filter(x=>x.role===state.role),student=state.role==='student';
      $('student-role').classList.toggle('active',student);$('lecturer-role').classList.toggle('active',!student);
      $('student-role').setAttribute('aria-pressed',student);$('lecturer-role').setAttribute('aria-pressed',!student);
      $('screen-list').innerHTML=group.map((x,i)=>`<button type="button" class="screen-link ${x.id===s.id?'active':''}" data-target="${x.id}" ${x.id===s.id?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span><span>${escape(x.title)}</span></button>`).join('');
      $('screen-name').textContent=`${student?'Mahasiswa':'Dosen'} / ${s.title}`;$('screen-count').textContent=`Layar ${group.indexOf(s)+1} dari ${group.length} · Web app desktop · Wireframe grayscale`;
      $('frame').className='frame desktop';
      let extra=state.scenario==='transcript-error'?'<div class="error">Transkrip terputus. Bagian sebelumnya tetap tersedia. <button class="btn" data-action="retry" type="button">Coba kembali</button></div>':state.scenario==='processing-error'?'<div class="error">Catatan gagal diproses. Sumber masih tersedia. <button class="btn" data-action="processing-retry" type="button">Coba proses ulang</button></div>':state.scenario==='sync-error'?'<div class="error">Pengiriman ke Google Calendar gagal. Agenda ClipThat tetap tersimpan. <button class="btn" data-action="retry" type="button">Coba kirim ulang</button></div>':state.scenario==='agenda-conflict'?'<div class="error">Perubahan deadline: sebelumnya 8 Oktober, usulan 10 Oktober. Perubahan pribadimu tetap berlaku sampai dikonfirmasi.</div>':state.scenario==='agenda-ambiguous'?'<div class="error">Pengumuman hanya menyebut “minggu depan”. Lengkapi tanggal sebelum mengonfirmasi.</div>':state.scenario==='agenda-manual'?'<div class="note">Agenda manual · perubahan disimpan atas tindakanmu.</div>':state.scenario==='microphone-error'?'<div class="error">Izin mikrofon ditolak. Kelas belum merekam. <button class="btn" data-action="retry" type="button">Periksa izin kembali</button></div>':state.scenario==='upload-error'?'<div class="error">Unggahan materi gagal. File belum tersedia untuk mahasiswa. <button class="btn" data-action="retry" type="button">Coba unggah lagi</button></div>':'';
      const centered=['s-processing','d-archive'].includes(s.id),cards=['s-integrations','d-home'].includes(s.id);
      const content=cards?s.blocks.map(block).join(''):desktopBlocks(s);
      $('frame').innerHTML=`<header class="app-header"><span class="wordmark">ClipThat</span><span class="app-context">Ruang kelas dan persiapan akademik</span><span class="role-chip">${student?'Mahasiswa':'Dosen'}</span></header><div class="app-shell">${appNavigation(student)}<div class="app-body"><h2>${escape(s.title)}</h2><p class="subtitle">${escape(s.subtitle)}</p>${extra}<div class="blocks ${centered?'layout-center':cards?'layout-cards':''} ${s.id==='s-integrations'?'layout-integrations':''}">${content}</div></div></div>`;
      if(state.screen==='s-agenda-change'&&state.agenda){$('agenda-title').value=state.agenda.title;$('agenda-date').value=state.agenda.date;$('agenda-time').value=state.agenda.time;$('agenda-scope').value=state.agenda.scope}
      if(state.scenario==='agenda-ambiguous')$('agenda-date').value='';
      if(state.screen==='s-capture'&&state.deleted.capture)$('frame').querySelector('.blocks').innerHTML='<div class="note">Capture pribadi ini sudah dihapus. Transkrip kelas tetap tersedia.</div>'+btn({label:'Kembali ke kelas',target:'s-live'});
      if(state.screen==='s-notes'&&state.deleted.notes)$('frame').querySelector('.blocks').innerHTML='<div class="note">Salinan catatan pribadimu sudah dihapus. Sumber kelas tetap tersedia.</div>'+btn({label:'Beranda',target:'s-home'});
      if(state.screen==='s-agenda'&&state.deleted.agenda)$('frame').querySelector('.blocks').innerHTML='<div class="note">Agenda yang dipilih telah dihapus.</div>'+btn({label:'Buat agenda',target:'s-agenda-change'});
      if(state.screen==='s-questions')for(const question of state.sent)$('frame').querySelector('.question-list').insertAdjacentHTML('afterbegin',`<article class="card"><span class="badge">Anonim · Belum dijawab</span><h4>${escape(question)}</h4><p>Pertanyaan terkirim dalam simulasi.</p></article>`);
      $('annotation').innerHTML=`<p><strong>Catatan desain:</strong> ${escape(s.note)}</p><p><strong>Kebutuhan:</strong> <code>${s.fr.join(' · ')}</code></p>${s.scenarios?`<div class="scenarios" aria-label="Kontrol skenario prototipe">${s.scenarios.map(x=>`<button type="button" data-scenario="${x}">${scenarioLabels[x]}</button>`).join('')}</div>`:''}`;
    }
    let toastTimer;function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,5000)}
    function modal(title,body,label,onConfirm){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-confirm').textContent=label;$('dialog-confirm').onclick=()=>{onConfirm();$('dialog').close()};$('dialog').showModal();$('dialog-cancel').focus()}
    function value(id){return $(id)?.value.trim()||''}
    function action(name){
      if(name==='join'){if(value('session-code').toUpperCase()==='ALG05')show('s-brief');else toast('Kode sesi tidak valid. Coba ALG05.');return}
      if(name==='send-question'){const q=value('question-draft')||value('new-question');if(!q){toast('Tuliskan pertanyaan terlebih dahulu.');return}state.sent.push(q);show('s-questions');toast('Pertanyaan dikirim secara anonim dalam simulasi.');return}
      if(name==='save-capture'){toast('Capture disimpan untuk review; draf belum dikirim.');show('s-live');return}
      if(name==='support'){state.support=!state.support;render();return}
      if(name==='save-photo'){if(!state.photo){toast('Pilih foto terlebih dahulu.');return}const time=value('photo-time');if(!/^\d{2}:\d{2}:\d{2}$/.test(time)){toast('Gunakan format timestamp HH:MM:SS.');return}state.photoTime=time;toast(`Foto pribadi disimpan pada ${time} dalam simulasi.`);return}
      if(name==='confirm-agenda'){for(const id of ['agenda-title','agenda-date','agenda-time']){if(!value(id)){$(id).reportValidity();return}}state.agenda={title:value('agenda-title'),date:value('agenda-date'),time:value('agenda-time'),scope:value('agenda-scope')};state.agendaConfirmed=true;state.agendaRejected=false;state.deleted.agenda=false;show('s-agenda');toast('Agenda dikonfirmasi. Pengiriman tujuan disimulasikan.');return}
      if(name==='reject-agenda'){state.agendaRejected=true;state.agendaConfirmed=false;show('s-agenda');toast('Draf ditolak; tidak dikirim ke layanan tujuan.');return}
      if(name.startsWith('toggle-')){const key=name.slice(7);state.connections[key]=!state.connections[key];render();toast(`${connectionName[key]} ${state.connections[key]?'terhubung':'diputus'} dalam simulasi.`);return}
      if(name==='start-class'){if(state.scenario==='microphone-error'){toast('Periksa izin mikrofon terlebih dahulu.');return}show('d-live');return}
      if(name==='end-class'){modal('Akhiri kelas?', '<p>Pengambilan audio berhenti. Sistem akan menyaring transkrip dan menyiapkan catatan, review, graph, serta draf agenda.</p>','Akhiri kelas',()=>{show('d-results');toast('Simulasi: kelas diakhiri dan hasil pemrosesan tersedia. Mahasiswa dapat meninjau status pada layar Kelas selesai.')});return}
      if(name==='mark-answer'){state.answered=true;render();toast('Pertanyaan ditandai dijawab secara lisan.');return}
      if(name==='publish-answer'){if(!value('lecturer-answer')){toast('Isi jawaban terlebih dahulu.');return}state.answer=value('lecturer-answer');state.answered=true;render();toast('Jawaban tersedia pada alur mahasiswa.');return}
      if(name==='save-graph'){state.graphCorrection={from:value('graph-from'),to:value('graph-to'),kind:value('graph-kind')};state.edgeRemoved=false;toast('Koreksi hubungan disimpan dalam simulasi.');return}
      if(name==='remove-edge'){modal('Hapus hubungan subbab?','<p>Hubungan yang dipilih dihapus dari graph bersama. Materi dan transkrip tidak dihapus.</p>','Hapus hubungan',()=>{state.edgeRemoved=true;render();toast('Hubungan dihapus dalam simulasi.')});return}
      if(name==='delete-personal'){const key=state.screen==='s-capture'?'capture':'notes';modal('Hapus data pribadi?', '<p>Hanya salinan milikmu yang dihapus. Sumber kelas dan data mahasiswa lain tetap tersedia.</p>','Hapus milik saya',()=>{state.deleted[key]=true;render();toast('Data pribadi dihapus dalam simulasi.')});return}
      if(name==='delete-shared'){modal('Arsipkan penghapusan sesi?', '<p>Materi, transkrip, pertanyaan, dan graph sesi ini disembunyikan dari peserta. Salinan catatan pribadi mahasiswa tetap tersimpan, dengan sumber tidak tersedia.</p><p>Dosen pemilik dapat memulihkan selama 30 hari. Setelah periode itu, data bersama dihapus permanen.</p>','Masukkan ke arsip',()=>{state.sharedArchived=true;show('d-archive');toast('Sesi masuk arsip penghapusan dalam simulasi.')});return}
      if(name==='delete-agenda'){modal('Hapus agenda?', '<p>Pilih apakah entri agenda yang dibuat ClipThat pada layanan tujuan ikut dihapus.</p><label><input type="checkbox" id="delete-external" checked> Hapus juga entri terkait di tujuan integrasi</label>','Hapus agenda',()=>{const external=$('delete-external').checked;state.deleted.agenda=true;render();toast(external?'Agenda dan entri tujuan terkait dihapus dalam simulasi.':'Agenda lokal dihapus; entri tujuan dibiarkan dan tidak disinkronkan lagi.')});return}
      if(name==='restore-session'){state.restored=true;state.sharedArchived=false;render();toast('Sesi dipulihkan dalam simulasi.');return}
      if(name==='processing-retry'){show('s-processing');toast('Pemrosesan diulang dalam simulasi.');return}
      if(name==='retry'){state.scenario=null;render();toast('Kondisi gagal dibersihkan dalam simulasi.');return}
      if(name==='copy-code'){if(navigator.clipboard)navigator.clipboard.writeText('ALG05').then(()=>toast('Kode ALG05 disalin.')).catch(()=>toast('Kode sesi: ALG05'));else toast('Kode sesi: ALG05');return}
      if(name==='material'){modal('Referensi materi','<p>Transformasi-linear.pdf · slide 8<br>Area penampil materi dosen. File materi asli belum disertakan dalam wireframe.</p>','Tutup',()=>{});return}
      if(name==='source'){modal('Sumber transkrip · 00:17:45','<p>“Untuk menentukan matriks transformasi, kita melihat citra setiap vektor basis.”</p><p>Aljabar Linear · Pertemuan 5</p>','Tutup',()=>{});return}
      if(name==='external-source'){modal('Struktur referensi tambahan','<p>Judul sumber, penulis/penerbit, tautan sumber, dan penjelasan bagian yang didukung referensi akan muncul di sini. Contoh ini tidak mengklaim telah mengambil referensi sungguhan.</p>','Tutup',()=>{});return}
    }
    document.addEventListener('click',e=>{const target=e.target.closest('[data-target],[data-action],[data-bookmark],[data-scenario],[data-node]');if(!target)return;if(target.dataset.target)show(target.dataset.target);else if(target.dataset.action)action(target.dataset.action);else if(target.dataset.bookmark){const time=target.dataset.bookmark,label=target.dataset.label;state.bookmarks[time]=state.bookmarks[time]===label?null:label;render();toast(state.bookmarks[time]?'Bagian disimpan sebagai kebutuhan review.':'Bookmark dihapus.')}else if(target.dataset.node){state.graphNode=target.dataset.node;render()}else{const scenario=target.dataset.scenario;if(scenario==='processing-ready'){show('s-notes');return}if(scenario==='short-capture'){show('s-capture');$('frame').querySelector('.subtitle').textContent='00:00:00–00:00:40 · konteks tersedia sejak awal sesi';toast('Simulasi capture ketika kelas baru berjalan 40 detik.');return}show(state.screen,scenario)}});
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node]')){e.preventDefault();state.graphNode=e.target.dataset.node;render()}});
    document.addEventListener('change',e=>{if(e.target.id==='file-upload'){const file=e.target.files[0];if(!file)return;if(state.screen==='s-photo'){if(!file.type.startsWith('image/')){toast('Pilih file gambar.');return}if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(file);$('photo-preview').innerHTML=`<img src="${state.photo}" alt="Pratinjau foto pilihanmu">`}else toast(`${file.name} dipilih; unggahan hanya simulasi.`)}});
    $('student-role').onclick=()=>show('s-home');$('lecturer-role').onclick=()=>show('d-home');$('dialog-cancel').onclick=()=>$('dialog').close();$('reset').onclick=()=>{location.hash='s-home';location.reload()};
    window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)&&id!==state.screen){state.screen=id;state.role=byId.get(id).role;state.scenario=null;render()}});
    if(byId.has(location.hash.slice(1))){state.screen=location.hash.slice(1);state.role=byId.get(state.screen).role}render();
  </script>
</body>
</html>
